<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Job Assist Ghana</title>
    <!-- Favicon - using your existing logo -->
    <link rel="icon" type="image/png" href="assets/images/tab-logo.png" />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="assets/js/api-integration.js"></script>
    <script src="assets/js/token-manager.js"></script>
    <script src="assets/js/input-hardening.js"></script>

    <style>
      :root {
        --deep-blue: #002147;
        --accent-gold: #f8c12e;
        --cream: #f7f7f7;
        --muted: #6b7280;
        --card-bg: #ffffff;
        --radius: 12px;
        --max-width: 1200px;
        --error-red: #e53e3e;
        --success-green: #38a169;
        --navy: #0a2a66;
        --gold: #f8c12e;
        --gold2: #ffda6a;
        --nav-h: 68px;
      }

      body {
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          "San Francisco",
          sans-serif;
        background-color: var(--cream);
        margin: 0;
        padding: 0;
        color: #333;
      }

      /* ---------- NAVBAR (copied from homepage) ---------- */
      .site-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2000;
        height: var(--nav-h);
        background: rgba(10, 42, 102, 0.97);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .nav-inner {
        height: var(--nav-h);
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        text-decoration: none;
        gap: 10px;
        min-width: 140px;
      }
      .brand img {
        height: 36px;
        width: auto;
        display: block;
        filter: brightness(0) invert(1);
      }
      .nav-links {
        display: none;
        list-style: none;
        margin: 0;
        padding: 0;
        align-items: center;
        gap: 18px;
      }
      .nav-links a {
        color: rgba(255, 255, 255, 0.92);
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        padding: 10px 10px;
        transition: color 0.2s ease, background 0.2s ease;
        border-radius: 8px;
        white-space: nowrap;
      }
      .nav-links a:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
      .nav-links a.active {
        color: var(--gold);
        background: rgba(248, 193, 46, 0.14);
      }
      .nav-cta {
        display: none;
        align-items: center;
        gap: 10px;
      }
      .btn-solid {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-weight: 800;
        font-size: 14px;
        padding: 12px 16px;
        border-radius: 6px;
        border: 1px solid transparent;
        transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        white-space: nowrap;
        line-height: 1;
      }
      .btn-solid-primary {
        background: var(--gold);
        color: var(--navy);
        box-shadow: 0 14px 26px rgba(248, 193, 46, 0.24);
      }
      .btn-solid-primary:hover {
        background: var(--gold2);
        color: var(--navy);
        transform: translateY(-1px);
        box-shadow: 0 18px 30px rgba(248, 193, 46, 0.28);
      }
      .menu-btn {
        width: 44px;
        height: 44px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        cursor: pointer;
      }
      .menu-btn i {
        font-size: 18px;
      }
      .mobile-drawer {
        position: fixed;
        top: var(--nav-h);
        left: 0;
        right: 0;
        z-index: 1999;
        display: none;
        background: rgba(10, 42, 102, 0.985);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        max-height: calc(100vh - var(--nav-h));
        overflow: auto;
      }
      .mobile-drawer.active {
        display: block;
      }
      .mobile-drawer a {
        display: block;
        padding: 14px 18px;
        color: rgba(255, 255, 255, 0.92);
        text-decoration: none;
        font-weight: 700;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .mobile-drawer a:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
      }
      .mobile-drawer a.active {
        color: var(--gold);
        background: rgba(248, 193, 46, 0.14);
      }
      .mobile-drawer .mobile-cta {
        padding: 14px 18px;
        border-bottom: none;
      }
      @media (min-width: 992px) {
        .nav-links {
          display: flex;
          margin-left: auto;
        }
        .nav-cta {
          display: flex;
        }
        .menu-btn {
          display: none;
        }
        .mobile-drawer {
          display: none !important;
        }
        .nav-inner {
          padding: 0 20px;
        }
      }

      /* ---------- FORGOT PASSWORD CONTAINER ---------- */
      .forgot-wrapper {
        margin-top: 80px;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 160px);
      }

      .forgot-container {
        max-width: 450px;
        width: 100%;
        background-color: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      .forgot-container h2 {
        text-align: center;
        margin-bottom: 1.8rem;
        color: var(--deep-blue);
        font-size: 1.8rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
        position: relative;
      }

      label {
        font-size: 14px;
        font-weight: 600;
        display: block;
        margin-bottom: 8px;
        color: var(--deep-blue);
      }

      input[type="tel"],
      input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
        transition:
          border 0.3s ease,
          box-shadow 0.3s ease;
      }

      input[type="tel"]:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent-gold);
        box-shadow: 0 0 0 3px rgba(248, 193, 46, 0.2);
      }

      /* Error states for input fields */
      input.error {
        border-color: var(--error-red);
        box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.1);
      }

      input.success {
        border-color: var(--success-green);
      }

      .error-message {
        color: var(--error-red);
        font-size: 12px;
        margin-top: 5px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .success-message {
        color: var(--success-green);
        font-size: 12px;
        margin-top: 5px;
        display: none;
      }

      .success-message.show {
        display: block;
      }

      .button-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1.5rem;
      }

      .btn {
        background-color: var(--accent-gold);
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        color: var(--deep-blue);
        font-family: "Segoe UI", sans-serif;
      }

      .btn:hover {
        background: #ffda6a;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(248, 193, 46, 0.3);
      }

      .btn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .btn-full {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
      }

      .footer {
        text-align: center;
        margin-top: 2rem;
        color: var(--muted);
        font-size: 14px;
      }

      .footer a {
        color: var(--accent-gold);
        text-decoration: none;
        font-weight: 600;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .phone-format {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
      }

      /* ---------- RESPONSIVE STYLES ---------- */
      @media (max-width: 768px) {
        .forgot-container {
          padding: 2rem 1.5rem;
          margin: 0 10px;
        }

        .forgot-wrapper {
          padding: 20px 10px;
        }
      }

      @media (max-width: 480px) {
        .forgot-container {
          padding: 1.5rem 1rem;
        }

        .forgot-container h2 {
          font-size: 1.5rem;
        }

        .button-row {
          justify-content: center;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  
    <link rel='stylesheet' href='assets/css/product-polish.css' />
  </head>
  <body>
    <!-- Standardized Navbar -->
    <header class="site-nav">
      <div class="nav-inner">
        <a class="brand" href="index.html"
          ><img src="assets/images/logo.png" alt="Job Assist Ghana Logo"
        /></a>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="build-cv.html">Build a CV</a></li>
        </ul>

        <div class="nav-cta">
          <a class="btn-solid btn-solid-primary" href="login.html">Login</a>
        </div>

        <button
          class="menu-btn"
          id="menuBtn"
          type="button"
          onclick="toggleMenu()"
          aria-label="Open menu"
        >
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <nav class="mobile-drawer" id="mobile-nav" aria-label="Mobile navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="build-cv.html">Build a CV</a>
        <a class="mobile-cta active" href="login.html">Login</a>
      </nav>
    </header>

    <!-- Forgot Password Section -->
    <div class="forgot-wrapper">
      <div class="forgot-container">
        <h2>Forgot Password</h2>
        <div id="formMessages"></div>
        <form id="forgotForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email address"
              required
            />
            <div class="error-message" id="email-error">
              Please enter a valid email address
            </div>
          </div>

          <button type="submit" class="btn btn-full" id="submitBtn">
            Send Reset Link
          </button>
        </form>

        <div class="footer">
          <p>Back to <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>

    <script>
      function toggleMenu() {
        const drawer = document.getElementById("mobile-nav");
        const icon = document.querySelector(".menu-btn i");
        if (!drawer || !icon) return;
        drawer.classList.toggle("active");
        if (drawer.classList.contains("active")) {
          icon.classList.remove("fa-bars");
          icon.classList.add("fa-xmark");
        } else {
          icon.classList.remove("fa-xmark");
          icon.classList.add("fa-bars");
        }
      }

      document.addEventListener("click", function (event) {
        const drawer = document.getElementById("mobile-nav");
        const menuBtn = document.querySelector(".menu-btn");
        const nav = document.querySelector(".site-nav");
        if (!drawer || !menuBtn || !nav) return;
        if (!nav.contains(event.target) && drawer.classList.contains("active")) {
          drawer.classList.remove("active");
          const icon = document.querySelector(".menu-btn i");
          if (icon) {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
          }
        }
      });

      document.querySelectorAll("#mobile-nav a").forEach((a) => {
        a.addEventListener("click", () => {
          const drawer = document.getElementById("mobile-nav");
          const icon = document.querySelector(".menu-btn i");
          if (drawer) drawer.classList.remove("active");
          if (icon) {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
          }
        });
      });

      document.addEventListener("DOMContentLoaded", function () {
        const emailInput = document.getElementById("email");
        const emailError = document.getElementById("email-error");
        const submitBtn = document.getElementById("submitBtn");
        const forgotForm = document.getElementById("forgotForm");
        const formMessages = document.getElementById("formMessages");

        emailInput.addEventListener("input", function () {
          emailInput.classList.remove("error", "success");
          emailError.classList.remove("show");
        });

        forgotForm.addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = emailInput.value.trim();
          if (!email) {
            emailInput.classList.add("error");
            emailError.textContent = "Please enter your email address";
            emailError.classList.add("show");
            emailInput.focus();
            return;
          }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            emailInput.classList.add("error");
            emailError.textContent = "Please enter a valid email address";
            emailError.classList.add("show");
            emailInput.focus();
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Sending...";

          try {
            const result = await window.JobAssistAPI.Auth.forgotPassword(email);
            if (result?.success) {
              formMessages.innerHTML = '<div class="success-message show" style="display:block;color:#38a169;margin-bottom:1rem;padding:12px;background:#f0fff4;border-radius:8px;border:1px solid #c6f6d5;">If an account exists with this email, a password reset link has been sent.</div>';
              emailInput.classList.add("success");
            } else {
              formMessages.innerHTML = '<div class="error-message show" style="display:block;color:#e53e3e;margin-bottom:1rem;padding:12px;background:#fff5f5;border-radius:8px;border:1px solid #fed7d7;">' + (result?.message || "Something went wrong. Please try again.") + '</div>';
            }
          } catch (error) {
            formMessages.innerHTML = '<div class="error-message show" style="display:block;color:#e53e3e;margin-bottom:1rem;padding:12px;background:#fff5f5;border-radius:8px;border:1px solid #fed7d7;">Network error. Please check your connection.</div>';
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send Reset Link";
          }
        });

        emailInput.focus();
      });
    </script>
  
    <script src='assets/js/product-polish.js'></script>
  </body>
</html>
