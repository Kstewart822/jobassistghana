<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Job Assist Ghana</title>
    <link rel="icon" type="image/png" href="assets/images/tab-logo.png" />
    <style>
      :root {
        --nav: #0b2a66;
        --nav2: #0a2660;
        --accent: #f6c343;
        --bg: #f5f7fb;
        --text: #0b2a66;
        --muted: #6b7280;
        --border: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        background: var(--bg);
        color: #111827;
      }

      /* Page */
      .login-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f5ee;
      }

      .login-shell {
        width: min(1100px, 96vw);
        height: 680px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #fff;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(11, 42, 102, 0.12);
        border: 4px solid #0a5a57;
      }

      .login-form-side {
        padding: 38px 42px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        background: #fff;
        overflow-y: auto;
      }

      .login-image-side {
        position: relative;
        background:
          linear-gradient(rgba(10, 42, 102, 0.1), rgba(10, 42, 102, 0.1)),
          url("assets/images/right-image.png") center/cover no-repeat;
      }

      .login-brand {
        display: inline-block;
        margin-bottom: 32px;
        text-decoration: none;
      }

      .login-brand img {
        height: 42px;
        width: auto;
        display: block;
      }

      .login-error {
        display: block;
        min-height: 18px;
        margin-top: 6px;
        padding: 0;
        border-radius: 0;
        background: transparent;
        color: #c0392b;
        font-size: 12.5px;
        line-height: 1.35;
        font-weight: 600;
        border: 0;
        visibility: hidden;
      }

      .field-inline-error {
        display: block;
        min-height: 18px;
        margin-top: 6px;
        padding: 0;
        border-radius: 0;
        background: transparent;
        color: #c0392b;
        font-size: 12.5px;
        line-height: 1.35;
        font-weight: 600;
        border: 0;
        visibility: hidden;
      }

      .login-error:empty,
      .field-inline-error:empty {
        min-height: 0;
        margin-top: 0;
      }

      .field-error {
        border-color: #e74c3c !important;
        box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1) !important;
      }

      .input-wrap {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 12px;
        background: #fff;
      }

      .input-wrap.password-wrap {
        position: relative;
        padding: 0 44px 0 12px;
      }

      .input-wrap:focus-within {
        border-color: #c7d2fe;
        box-shadow: 0 0 0 3px rgba(199, 210, 254, 0.5);
      }

      .input {
        width: 100%;
        border: 0;
        outline: none;
        padding: 12px 0;
        font-size: 14px;
        background: transparent;
        color: #111827;
      }

      .password-toggle {
        position: absolute !important;
        top: 50% !important;
        right: 8px !important;
        transform: translateY(-50%) !important;
        width: 32px !important;
        height: 32px !important;
        min-width: 32px !important;
        min-height: 32px !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        background: transparent !important;
        color: #64748b;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        line-height: 1 !important;
        cursor: pointer;
        z-index: 2;
      }

      .password-toggle:hover,
      .password-toggle:active,
      .password-toggle:focus {
        top: 50% !important;
        transform: translateY(-50%) !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        color: #0a2a66;
      }

      .password-toggle svg {
        width: 18px;
        height: 18px;
        pointer-events: none;
        display: block;
      }

      .password-toggle:focus-visible {
        outline: 2px solid rgba(248, 193, 46, 0.8);
        outline-offset: 2px;
        border-radius: 8px;
      }

      .password-toggle .icon-hide {
        display: none;
      }

      .password-toggle.is-visible .icon-show {
        display: none;
      }

      .password-toggle.is-visible .icon-hide {
        display: inline-flex;
      }

      .title {
        text-align: left;
        font-size: 28px;
        line-height: 1.2;
        color: var(--text);
        margin: 0 0 10px;
        font-weight: 800;
      }

      .subtitle {
        color: var(--muted);
        font-size: 15px;
        margin: 0 0 28px;
        text-align: left;
      }

      .form-actions {
        display: flex;
        gap: 14px;
        margin-top: 18px;
      }

      .btn-secondary {
        width: 100%;
        margin-top: 16px;
        background: #fff;
        border: 1.5px solid #0a5a57;
        color: #0a5a57;
        font-weight: 800;
        padding: 12px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-secondary:hover {
        background: #f8fafc;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        font-size: 13px;
      }

      .meta-row a {
        color: #d97706;
        text-decoration: none;
        font-weight: 700;
      }

      .footer-note {
        margin-top: auto;
        padding-top: 26px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }

      @media (max-width: 900px) {
        .login-shell {
          grid-template-columns: 1fr;
          height: auto;
        }

        .login-image-side {
          min-height: 260px;
          order: -1;
        }

        .login-form-side {
          padding: 32px 22px;
          overflow: visible;
        }
      }

      @media (max-width: 768px) {
        .login-image-side {
          display: none !important;
        }

        .login-shell {
          grid-template-columns: 1fr !important;
          height: auto;
        }
      }

      label {
        display: block;
        font-weight: 700;
        color: var(--text);
        font-size: 13px;
        margin: 14px 0 8px;
      }
      .phone-row {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
      }
      .country-code {
        font-weight: 800;
        color: #374151;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #f3f4f6;
        border: 1px solid var(--border);
        white-space: nowrap;
      }
      input[type="text"],
      input[type="password"] {
        border: 0;
        outline: none;
        width: 100%;
        font-size: 14px;
        background: transparent;
        color: #111827;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0 0;
      }
      .input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        outline: none;
      }
      .input:focus,
      .phone-row:focus-within {
        border-color: #c7d2fe;
        box-shadow: 0 0 0 3px rgba(199, 210, 254, 0.5);
      }
      .btn {
        width: 100%;
        margin-top: 16px;
        background: var(--accent);
        border: 0;
        color: #111827;
        font-weight: 900;
        padding: 12px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      .btn:hover {
        filter: brightness(0.98);
      }
      .links {
        text-align: center;
        margin-top: 14px;
        font-size: 13px;
      }
      .links a {
        color: #f59e0b;
        text-decoration: none;
        font-weight: 800;
      }
      .links a:hover {
        text-decoration: underline;
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 420px) {
        .title {
          font-size: 24px;
        }
      }
    </style>

    <link rel="stylesheet" href="assets/css/product-polish.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-shell">
        <div class="login-form-side">
          <a href="index.html" class="login-brand" aria-label="Go to home">
            <img src="assets/images/logo2.png" alt="Job Assist Ghana" />
          </a>
          <h1 class="title">Candidate Login</h1>
          <div class="subtitle">
            Access your dashboard, Browse jobs, and apply
          </div>

          <form id="loginForm">
            <label for="emailInput">Email Address</label>
            <div class="input-wrap">
              <input
                id="emailInput"
                class="input"
                type="email"
                placeholder="your@email.com"
                required
              />
            </div>
            <div id="emailError" class="field-inline-error"></div>

            <label for="passInput">Password</label>
            <div class="input-wrap password-wrap">
              <input
                id="passInput"
                class="input"
                type="password"
                placeholder="Enter your password"
                minlength="8"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-target="passInput"
                aria-label="Show password"
                aria-pressed="false"
              >
                <span class="icon-show" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </span>
                <span class="icon-hide" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
                    <path
                      d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18.7 18.7 0 0 1-3 3.8"
                    ></path>
                    <path
                      d="M6.6 6.7C4 8.6 2 12 2 12s3.5 7 10 7a10.5 10.5 0 0 0 4.1-.8"
                    ></path>
                  </svg>
                </span>
              </button>
            </div>
            <div id="passwordError" class="field-inline-error"></div>
            <div id="loginError" class="login-error"></div>

            <div class="meta-row">
              <label
                style="
                  margin: 0;
                  font-weight: 500;
                  color: var(--muted);
                  display: flex;
                  align-items: center;
                  gap: 8px;
                "
              >
                <input type="checkbox" />
                Remember me
              </label>
              <a href="forgot-password.html">Forgot password?</a>
            </div>

            <div class="form-actions">
              <button class="btn" type="submit">Login</button>
              <a href="signup.html" class="btn-secondary">Create account</a>
            </div>

            <div class="footer-note">
              By signing in, you agree to our terms and privacy policy.
            </div>
          </form>
        </div>

        <div class="login-image-side"></div>
      </div>
    </div>

    <script src="assets/js/api-integration.js"></script>  <script src="assets/js/token-manager.js"></script>    <script src="assets/js/input-hardening.js"></script>
    <script src="assets/js/candidate-session.js"></script>
    <script src="assets/js/password-toggle.js"></script>
    <script>
      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("emailInput");
      const passInput = document.getElementById("passInput");
      const loginError = document.getElementById("loginError");
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");

      function initializePasswordToggles() {
        window.JobAssistPasswordToggle?.initPasswordToggles?.();
      }

      function showError(element, message) {
        if (element.closest) {
          element.closest(".input-wrap, .phone-row")?.classList.add("field-error");
        }
        element.textContent = message;
        element.style.visibility = "visible";
      }

      function clearError(element, inputElement) {
        if (inputElement?.closest) {
          inputElement.closest(".input-wrap, .phone-row")?.classList.remove("field-error");
        }
        element.textContent = "";
        element.style.visibility = "hidden";
      }

      async function handleLogin(e) {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passInput.value.trim();

        // Clear previous errors
        clearError(loginError, emailInput);
        clearError(emailError, emailInput);
        clearError(passwordError, passInput);

        // Validate inputs
        if (!email) {
          showError(emailError, "Email is required.");
          return;
        }

        if (!password) {
          showError(passwordError, "Password is required.");
          return;
        }

        if (password.length < 8) {
          showError(passwordError, "Password must be at least 8 characters.");
          return;
        }

        // Validate email format
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showError(emailError, "Please enter a valid email address.");
          return;
        }

        // Show loading state
        const submitBtn = loginForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        try {
          // Call API
          const result = await window.JobAssistAPI.Auth.login(email, password);

          if (result.success) {
            // Store user data and redirect
            const user = result.data?.data?.user;
            if (user?.role === 'employer') {
              window.location.href = "employer/employer-dashboard.html";
            } else {
              window.location.href = "candidate/candidate-dashboard.html";
            }
          } else {
            // Show error
            const errorMessage = result.data?.message || result.message || "Login failed. Please try again.";
            showError(loginError, errorMessage);
          }
        } catch (error) {
          showError(loginError, "Network error. Please check your connection.");
          console.error("Login error:", error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      }

      loginForm.addEventListener("submit", handleLogin);
      initializePasswordToggles();

      // Clear errors on input
      emailInput.addEventListener("input", function () {
        clearError(emailError, this);
        clearError(loginError);
      });

      passInput.addEventListener("input", function () {
        if (this.value.length >= 8) {
          clearError(passwordError, this);
        }
        clearError(loginError);
      });
    </script>

    <script src="assets/js/product-polish.js"></script>
  </body>
</html>
